de:
    title: All-Inkl
    description: >
        Verwaltet ein Webhosting bei All-Inkl direkt im Backend: Domains und DNS,
        Postfächer, Weiterleitungen, Datenbanken, FTP, Cronjobs und mehr. Die Daten
        kommen über die offizielle Schnittstelle von All-Inkl; Änderungen gehen sofort
        dorthin. Mit Schreibschutz für einen gefahrlosen Test.
    keywords:
        - All-Inkl
        - KAS
        - Webhosting
        - Domains
        - DNS
        - Postfächer

en:
    title: All-Inkl
    description: >
        Manages a web hosting package at All-Inkl directly in the back end: domains and
        DNS, mailboxes, forwardings, databases, FTP, cron jobs and more. The data comes
        from the official All-Inkl interface; changes are sent there immediately.
        Includes a write protection for safe testing.
    keywords:
        - All-Inkl
        - KAS
        - web hosting
        - domains
        - DNS
        - mailboxes
